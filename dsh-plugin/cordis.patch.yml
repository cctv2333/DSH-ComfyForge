# Comfy 实时台 bundle 层：一个 Host 行 + 一个 Client 半。
# Host 半连 ComfyUI 的 /ws，落盘每次执行，并在 DSH 自己的 HTTP 服务上挂同源路由
# （/comfy-live/*）：所以没有第二个端口、没有 CORS、不用手动起服务。
# 可选配置（都可省略）：
#   comfyUrl    ComfyUI 地址，默认 http://127.0.0.1:8188
#   comfyRoot   ComfyUI 根目录（用来把我跑的工作流写进它的工作流列表）
#   projectRoot ComfyForge 仓库根目录（runs/live 落在这里）
#   saveWorkflow 是否把每次执行的图写进 ComfyUI/user/default/workflows（默认 true）
#
# 下面三个路径请改成你自己的；不填 comfyRoot 就退化成「不写工作流列表」。
- insert:
    - id: dsh-comfy-live
      name: '@local/dsh-comfy-live'
      config:
        comfyUrl: http://127.0.0.1:8188
        comfyRoot: <改成你的 ComfyUI 目录，例如 D:/ComfyUI>
        projectRoot: <改成你的 ComfyForge 仓库目录>
        saveWorkflow: true

